name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read version
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "vsix=csharp-razor-taghelpers-${VERSION}.vsix" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${VERSION}"
            exit 1
          fi

      - name: Package VSIX
        run: npx --yes @vscode/vsce package

      - name: Release notes
        run: node .github/scripts/latest-changelog.js

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          VSIX: ${{ steps.meta.outputs.vsix }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" \
            --title "${VERSION}" \
            --notes-file release-notes.md \
            --target "${GITHUB_SHA}" \
            "$VSIX"

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT || secrets.VS_MARKETPLACE_TOKEN }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "Missing Open VSX token. Set OVSX_PAT (or VS_MARKETPLACE_TOKEN) to a token from https://open-vsx.org/user-settings/tokens"
            exit 1
          fi
          echo "Open VSX token is present (${#OVSX_PAT} characters)."
          npx --yes ovsx create-namespace M455YN || echo "Namespace M455YN already exists or could not be created; continuing to publish."
          npx --yes ovsx publish "${{ steps.meta.outputs.vsix }}" --skip-duplicate

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "Skipping Visual Studio Marketplace (no VSCE_PAT)."
            echo "Open VSX tokens do not work here. Create an Azure DevOps PAT (Marketplace -> Manage, All accessible organizations) and store it as VSCE_PAT."
            exit 0
          fi
          npx --yes @vscode/vsce verify-pat M455YN
          npx --yes @vscode/vsce publish --packagePath "${{ steps.meta.outputs.vsix }}" --skip-duplicate
