  </defs>

  <rect x="0" y="0" width="128" height="128" rx="22" fill="#000000"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="#FFFFFF" stroke-width="2"/>

  <g transform="translate(64 64) rotate(-8)" clip-path="url(#blade)">
