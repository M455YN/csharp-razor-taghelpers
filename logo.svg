    <rect x="8" y="-16" width="40" height="32" fill="#2A2A2A"/>
    <rect x="-46" y="-16" width="54" height="32" fill="#FFFFFF"/>

    <!-- Otwory -->
    <rect x="-11" y="-4" width="22" height="8" rx="4" fill="#000000"/>
    <circle cx="-26" cy="0" r="3.5" fill="#000000"/>
    <circle cx="26" cy="0" r="3.5" fill="#000000"/>
  </g>

  <!-- Highlight -->
  <g transform="translate(64 64) rotate(-8)">
    <line x1="-40" y1="-12" x2="0" y2="-12" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <path d="M 22 40 L 14 64 L 22 88" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 106 40 L 114 64 L 106 88" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
</svg>
